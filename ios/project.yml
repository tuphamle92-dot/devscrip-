# muguet - project.yml
# Constantin Clerc (c22dev) - 0.1

name: Mugoat
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Mugoat:
    type: application
    platform: iOS
    sources:
      - path: stub.c
      - path: LaunchScreen.storyboard
      - path: Assets.xcassets
      - path: ControlIcons
      - path: AppIcon60x60@2x.png
      - path: AppIcon60x60@3x.png
      - path: AppIcon76x76@2x~ipad.png
      - path: AppIcon-1024.png
      - path: ../assets/mugoat_logo.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.iosvn.mugoat
        PRODUCT_NAME: Mugoat
        EXECUTABLE_NAME: muguet
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Muguet.entitlements
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: NO
        STRIP_INSTALLED_PRODUCT: NO
        DEBUG_INFORMATION_FORMAT: dwarf
    postBuildScripts:
      - name: Use the Rust executable
        basedOnDependencyAnalysis: false
        script: |
          set -e
          xcrun vtool -set-build-version ios 16.0 26.0 -replace -output "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" \
            "$SRCROOT/../target/ios/aarch64-apple-ios/release/muguet"
